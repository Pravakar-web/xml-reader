<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Employee Directory</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #eef2ff;
            --bg-page: #f8fafc;
            --surface: #ffffff;
            --text-dark: #0f172a;
            --text-regular: #334155;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --border-hover: #cbd5e1;
            --radius-md: 10px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.03);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-regular);
            min-height: 100vh;
            padding-bottom: 60px;
        }

        /* Top Navigation Bar */
        .navbar {
            background-color: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 50;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.15rem;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.25);
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-dark);
            letter-spacing: -0.02em;
        }

        .badge-live {
            background-color: #ecfdf5;
            color: #059669;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 9999px;
            border: 1px solid #a7f3d0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-live::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #10b981;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
        }

        /* Main App Container */
        .app-container {
            max-width: 1280px;
            margin: 32px auto 0 auto;
            padding: 0 24px;
        }

        /* Stats Row */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 28px;
        }

        .stat-card {
            background-color: var(--surface);
            border-radius: var(--radius-md);
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 18px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }

        .stat-info .label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .stat-info .val {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-top: 2px;
        }

        /* Controls / Filter Bar */
        .control-panel {
            background-color: var(--surface);
            border-radius: var(--radius-lg);
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            justify-content: space-between;
        }

        .search-filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            flex: 1;
            min-width: 320px;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 240px;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px 10px 40px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
            background-color: #fafbfc;
        }

        .search-box input:focus {
            border-color: var(--primary);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .select-filter {
            padding: 10px 36px 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 0.9rem;
            background-color: #fafbfc;
            color: var(--text-regular);
            outline: none;
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2364748B%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 9px ease;
            transition: border-color 0.15s;
        }

        .select-filter:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .btn-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.88rem;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #fff;
            box-shadow: 0 2px 4px rgba(79, 70, 229, 0.2);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-outline {
            background-color: var(--surface);
            color: var(--text-regular);
            border-color: var(--border);
        }

        .btn-outline:hover {
            background-color: #f1f5f9;
            border-color: var(--border-hover);
        }

        /* Status Banner */
        .status-alert {
            padding: 12px 18px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            font-size: 0.875rem;
            font-weight: 500;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .status-alert.info {
            background-color: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
            display: flex;
        }

        .status-alert.success {
            background-color: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
            display: flex;
        }

        .status-alert.error {
            background-color: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            display: flex;
        }

        /* Professional Data Table */
        .table-wrapper {
            background-color: var(--surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead tr {
            background-color: #f8fafc;
            border-bottom: 1px solid var(--border);
        }

        th {
            padding: 14px 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            white-space: nowrap;
        }

        tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background-color 0.15s ease;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody tr:hover {
            background-color: #f8faff;
        }

        td {
            padding: 16px 20px;
            font-size: 0.88rem;
            color: var(--text-regular);
            vertical-align: middle;
        }

        .emp-id {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-weight: 600;
            color: #475569;
            background: #f1f5f9;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.82rem;
            display: inline-block;
        }

        .emp-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.85rem;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .emp-name {
            font-weight: 600;
            color: var(--text-dark);
            font-size: 0.92rem;
        }

        .dept-tag {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* Dynamic Department Color Palette */
        .dept-engineering { background: #e0e7ff; color: #4338ca; }
        .dept-marketing { background: #fef3c7; color: #b45309; }
        .dept-human-resources { background: #fce7f3; color: #be185d; }
        .dept-finance { background: #dcfce7; color: #15803d; }
        .dept-design { background: #f3e8ff; color: #7e22ce; }
        .dept-default { background: #f1f5f9; color: #475569; }

        .designation-text {
            color: var(--text-regular);
            font-weight: 500;
        }

        .email-link {
            color: var(--primary);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
        }

        .email-link:hover {
            text-decoration: underline;
        }

        .salary-value {
            font-weight: 600;
            color: #0f172a;
            font-variant-numeric: tabular-nums;
        }

        .table-footer {
            padding: 14px 20px;
            background-color: #fafbfc;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .empty-state {
            padding: 60px 20px;
            text-align: center;
        }

        .empty-state i {
            font-size: 3rem;
            color: #cbd5e1;
            margin-bottom: 16px;
        }

        .empty-state h3 {
            font-size: 1.1rem;
            color: var(--text-dark);
            margin-bottom: 6px;
        }

        .empty-state p {
            color: var(--text-muted);
            font-size: 0.88rem;
        }
    </style>
</head>
<body>

<!-- Top App Bar -->
<header class="navbar">
    <div class="brand-container">
        <div class="brand-logo">
            <i class="fa-solid fa-users"></i>
        </div>
        <div>
            <div class="brand-title">WorkPulse</div>
        </div>
    </div>
    <div class="badge-live">XML Reader v2.0</div>
</header>

<main class="app-container">
    <!-- Quick Analytics Stats Row -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon" style="background: #eef2ff; color: #4f46e5;">
                <i class="fa-solid fa-user-group"></i>
            </div>
            <div class="stat-info">
                <div class="label">Total Employees</div>
                <div class="val" id="totalCount">0</div>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon" style="background: #ecfdf5; color: #059669;">
                <i class="fa-solid fa-building"></i>
            </div>
            <div class="stat-info">
                <div class="label">Departments</div>
                <div class="val" id="deptCount">0</div>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon" style="background: #fffbeb; color: #d97706;">
                <i class="fa-solid fa-wallet"></i>
            </div>
            <div class="stat-info">
                <div class="label">Average Salary</div>
                <div class="val" id="avgSalary">$0</div>
            </div>
        </div>
    </div>

    <!-- Interactive Filter & Action Bar -->
    <div class="control-panel">
        <div class="search-filter-group">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search by name, ID, or role..." oninput="handleFilterChange()">
            </div>
            <select id="departmentFilter" class="select-filter" onchange="handleFilterChange()">
                <option value="ALL">All Departments</option>
            </select>
        </div>

        <div class="btn-actions">
            <button class="btn btn-outline" onclick="triggerFileUpload()">
                <i class="fa-solid fa-cloud-arrow-up"></i> Upload XML
            </button>
            <input type="file" id="xmlFileInput" accept=".xml" style="display: none;" onchange="handleCustomFileUpload(event)">

            <button class="btn btn-primary" onclick="loadDefaultXML()">
                <i class="fa-solid fa-rotate"></i> Reload Default XML
            </button>
        </div>
    </div>

    <!-- Alert / Status Notice -->
    <div id="statusAlert" class="status-alert">
        <i id="statusIcon" class="fa-solid fa-circle-info"></i>
        <span id="statusMessage">Status message</span>
    </div>

    <!-- Main Data Table -->
    <div class="table-wrapper">
        <div class="table-responsive">
            <table id="employeesTable">
                <thead>
                    <tr>
                        <th>Employee ID</th>
                        <th>Employee Name</th>
                        <th>Department</th>
                        <th>Role / Designation</th>
                        <th>Email Contact</th>
                        <th>Annual Compensation</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="6">
                            <div class="empty-state">
                                <i class="fa-solid fa-spinner fa-spin"></i>
                                <h3>Loading employee records...</h3>
                                <p>Parsing XML structure.</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Table Footer Info -->
        <div class="table-footer">
            <span id="recordsInfo">Showing 0 records</span>
            <span>Source: XML Document Data Model</span>
        </div>
    </div>
</main>

<script>
    let employeesData = [];

    // Helper: Display Status Banner
    function showStatus(message, type = 'info') {
        const alertBox = document.getElementById('statusAlert');
        const alertMsg = document.getElementById('statusMessage');
        const alertIcon = document.getElementById('statusIcon');

        alertBox.className = 'status-alert ' + type;
        alertMsg.textContent = message;

        if (type === 'success') {
            alertIcon.className = 'fa-solid fa-circle-check';
        } else if (type === 'error') {
            alertIcon.className = 'fa-solid fa-circle-exclamation';
        } else {
            alertIcon.className = 'fa-solid fa-circle-info';
        }

        alertBox.style.display = 'flex';
    }

    // Helper: Get Initials for Avatar
    function getInitials(name) {
        if (!name) return '?';
        const parts = name.trim().split(' ');
        if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
        return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
    }

    // Helper: Map Department to class name
    function getDeptClass(dept) {
        if (!dept) return 'dept-default';
        const normalized = dept.toLowerCase().replace(/[^a-z0-9]/g, '-');
        if (['engineering', 'marketing', 'human-resources', 'finance', 'design'].includes(normalized)) {
            return 'dept-' + normalized;
        }
        return 'dept-default';
    }

    // 1. Fetch XML from default employees.xml
    function loadDefaultXML() {
        showStatus('Fetching employees.xml...', 'info');
        const xhr = new XMLHttpRequest();
        xhr.open('GET', 'employees.xml', true);
        xhr.onload = function () {
            if (xhr.status === 200 || (xhr.status === 0 && xhr.responseXML)) {
                const xmlDoc = xhr.responseXML || new DOMParser().parseFromString(xhr.responseText, 'application/xml');
                processXML(xmlDoc);
                showStatus('Successfully loaded default employee dataset.', 'success');
            } else {
                showStatus('Unable to fetch employees.xml. Use "Upload XML" to load your file directly.', 'error');
            }
        };
        xhr.onerror = function () {
            showStatus('Network or local CORS restriction. Click "Upload XML" to choose employees.xml directly.', 'error');
        };
        xhr.send();
    }

    // 2. Upload and Parse XML directly via FileReader
    function triggerFileUpload() {
        document.getElementById('xmlFileInput').click();
    }

    function handleCustomFileUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        showStatus(`Reading "${file.name}"...`, 'info');
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(e.target.result, "application/xml");
                const errors = xmlDoc.getElementsByTagName("parsererror");
                if (errors.length > 0) {
                    showStatus('XML parsing error: The uploaded file has invalid syntax.', 'error');
                    return;
                }
                processXML(xmlDoc);
                showStatus(`Successfully parsed ${file.name}.`, 'success');
            } catch (err) {
                showStatus('Failed to read or parse file.', 'error');
            }
        };
        reader.onerror = () => showStatus('File read error.', 'error');
        reader.readAsText(file);
    }

    // 3. Process XML Nodes into Object Array
    function processXML(xmlDoc) {
        const records = xmlDoc.getElementsByTagName('employee');
        employeesData = [];

        for (let i = 0; i < records.length; i++) {
            const item = records[i];
            employeesData.push({
                id: getVal(item, 'id'),
                name: getVal(item, 'name'),
                department: getVal(item, 'department'),
                designation: getVal(item, 'designation'),
                email: getVal(item, 'email'),
                salary: parseFloat(getVal(item, 'salary')) || 0
            });
        }

        populateDepartmentFilter();
        updateStats();
        renderTable(employeesData);
    }

    function getVal(parent, tag) {
        const node = parent.getElementsByTagName(tag)[0];
        return node && node.textContent ? node.textContent.trim() : '';
    }

    // 4. Update Overview Stats
    function updateStats() {
        document.getElementById('totalCount').textContent = employeesData.length;
        
        const depts = new Set(employeesData.map(e => e.department).filter(Boolean));
        document.getElementById('deptCount').textContent = depts.size;

        if (employeesData.length > 0) {
            const totalSal = employeesData.reduce((acc, curr) => acc + (curr.salary || 0), 0);
            const avg = Math.round(totalSal / employeesData.length);
            document.getElementById('avgSalary').textContent = '$' + avg.toLocaleString();
        } else {
            document.getElementById('avgSalary').textContent = '$0';
        }
    }

    // 5. Populate Department Dropdown Filter
    function populateDepartmentFilter() {
        const select = document.getElementById('departmentFilter');
        select.innerHTML = '<option value="ALL">All Departments</option>';

        const depts = Array.from(new Set(employeesData.map(e => e.department).filter(Boolean))).sort();
        depts.forEach(dept => {
            const opt = document.createElement('option');
            opt.value = dept;
            opt.textContent = dept;
            select.appendChild(opt);
        });
    }

    // 6. Handle Search & Filter
    function handleFilterChange() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const selectedDept = document.getElementById('departmentFilter').value;

        const filtered = employeesData.filter(emp => {
            const matchesDept = selectedDept === 'ALL' || emp.department === selectedDept;
            const matchesQuery = !query || 
                emp.name.toLowerCase().includes(query) ||
                emp.id.toLowerCase().includes(query) ||
                emp.designation.toLowerCase().includes(query) ||
                emp.email.toLowerCase().includes(query);

            return matchesDept && matchesQuery;
        });

        renderTable(filtered);
    }

    // 7. Render Table
    function renderTable(list) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        document.getElementById('recordsInfo').textContent = `Showing ${list.length} of ${employeesData.length} records`;

        if (list.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="6">
                        <div class="empty-state">
                            <i class="fa-regular fa-folder-open"></i>
                            <h3>No Records Found</h3>
                            <p>Try refining your search query or department filter.</p>
                        </div>
                    </td>
                </tr>
            `;
            return;
        }

        list.forEach(emp => {
            const tr = document.createElement('tr');
            const initials = getInitials(emp.name);
            const deptClass = getDeptClass(emp.department);
            const salaryFormatted = emp.salary ? `$${emp.salary.toLocaleString()}` : 'N/A';

            tr.innerHTML = `
                <td><span class="emp-id">${escapeHtml(emp.id)}</span></td>
                <td>
                    <div class="emp-profile">
                        <div class="avatar">${initials}</div>
                        <span class="emp-name">${escapeHtml(emp.name)}</span>
                    </div>
                </td>
                <td>
                    <span class="dept-tag ${deptClass}">
                        ${escapeHtml(emp.department || 'General')}
                    </span>
                </td>
                <td><span class="designation-text">${escapeHtml(emp.designation)}</span></td>
                <td>
                    <a href="mailto:${escapeHtml(emp.email)}" class="email-link">
                        <i class="fa-regular fa-envelope"></i>
                        ${escapeHtml(emp.email)}
                    </a>
                </td>
                <td><span class="salary-value">${salaryFormatted}</span></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // On Load
    window.addEventListener('DOMContentLoaded', () => {
        loadDefaultXML();
    });
</script>

</body>
</html>
